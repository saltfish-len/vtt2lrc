name: 部署网页版

# web/ 下是纯静态页面，没有构建步骤，跑完测试直接发到 GitHub Pages。
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，但不打断进行中的那个
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: 转换核心测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 跑单元测试
        run: node --test tests/vtt2lrc.test.mjs

  deploy:
    name: 发布到 Pages
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
